name: Build CPA38 SSE boundary candidate

on:
  push:
    branches:
      - ci-v8.0.38-pr6760-20261022-image

permissions:
  contents: read
  packages: write

concurrency:
  group: build-pr6760-v8.0.38-image
  cancel-in-progress: false

env:
  # Upstream v8.0.38 includes PR 6189; carry only PR 6760 SSE boundaries.
  SOURCE_SHA: 47749f441ae5817c310a2959774e37c5f96a474a
  IMAGE: ghcr.io/xz-dev/cli-proxy-api
  IMAGE_TAG: v8.0.38-pr6760-47749f441ae5

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify exact source and formatting
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(gofmt -l internal/runtime/executor/codex_executor_stream.go sdk/api/handlers/openai/codex_metadata_boundary_test.go)"

      - name: Test xAI prefix regressions retained from upstream
        timeout-minutes: 10
        run: go test -v -count=1 -timeout 5m -run '^TestXAIImages(RoutesWithPrefixedModelWhenForceModelPrefixEnabled|SupportsBuiltInPrefixFallbackAndCustomCredentialPrefix)$' ./sdk/api/handlers/openai

      - name: Test relevant handler and executor packages
        timeout-minutes: 15
        run: go test -count=1 -timeout 5m ./sdk/api/handlers/... ./internal/runtime/executor ./internal/runtime/executor/helps

      - name: Race-check SSE boundaries
        timeout-minutes: 10
        run: go test -v -race -count=3 -timeout 5m -run '^TestCodex(MetadataBoundaryThroughResponsesHandler|BlankPreludeDoesNotStartStream)$' ./sdk/api/handlers/openai

      - name: Verify server build
        timeout-minutes: 10
        run: go build -o "$RUNNER_TEMP/cli-proxy-api" ./cmd/server

      - name: Set reproducible build date
        run: echo "BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            VERSION=${{ env.IMAGE_TAG }}
            COMMIT=${{ env.SOURCE_SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          labels: |
            org.opencontainers.image.source=https://github.com/xz-dev/CLIProxyAPI
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}

      - name: Record image digest
        run: |
          printf 'Source: `%s`\nImage: `%s:%s`\nDigest: `%s`\n' "$SOURCE_SHA" "$IMAGE" "$IMAGE_TAG" '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
