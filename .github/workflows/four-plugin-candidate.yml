name: Build CPA four-plugin Core candidate

on:
  push:
    branches: [ci]

permissions:
  contents: read
  packages: write

concurrency:
  group: cpa-four-plugin-core-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: xz-dev/CLIProxyAPI
  SOURCE_SHA: 95ab2b103b5748a2049c4aff9d50f135fe84cb6a
  IMAGE: ghcr.io/xz-dev/cli-proxy-api
  IMAGE_TAG: candidate-four-plugin-core-95ab2b103b57
  BUILD_DATE: "2026-08-26T08:36:35Z"

jobs:
  verify:
    name: Test and build exact source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test affected packages
        run: >-
          go test -count=1
          ./internal/config
          ./internal/pluginhost
          ./internal/watcher
          ./internal/watcher/diff
          ./internal/api/handlers/management
          ./internal/modelconfig
          ./sdk/cliproxy
      - name: Cross-compile plugin host tests for Windows
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o /tmp/cliproxyapi-pluginhost-windows.test.exe ./internal/pluginhost
      - name: Build server
        run: go build -o /tmp/cli-proxy-api ./cmd/server

  docker:
    name: Build and publish amd64 image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push exact candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ env.IMAGE_TAG }}
            COMMIT=${{ env.SOURCE_SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.SOURCE_REPOSITORY }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
      - name: Record immutable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          {
            echo '### Immutable candidate'
            echo "- Source: $SOURCE_REPOSITORY@$SOURCE_SHA"
            echo "- Image: $IMAGE:$IMAGE_TAG"
            echo "- Digest: $IMAGE@$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
