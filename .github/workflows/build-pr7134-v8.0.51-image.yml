name: build-pr7134-v8.0.51-image

# One-shot publication of the CPA v8.0.51 + PR7134 backport image.
# Triggers only on the owned maintenance branch; no tag, release or
# default-branch publication path.

on:
  push:
    branches:
      - patch/v8.0.51-pr7134

permissions:
  contents: read

concurrency:
  group: build-pr7134-v8.0.51-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cli-proxy-api
  EXPECTED_BASE_SHA: 7cad1cb7df48c6c5ffb7ff0b34ef8198806115bc

jobs:
  tests:
    name: Regression tests (full suite, unskipped)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify base and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE_SHA"
          changed=$(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD)
          expected=$(printf '%s\n' \
            internal/runtime/executor/codex_executor_html_rejection_test.go \
            internal/runtime/executor/codex_executor_terminal.go \
            internal/runtime/executor/helps/codex_html_rejection.go \
            sdk/cliproxy/auth/conductor_cooldown.go \
            sdk/cliproxy/auth/conductor_http2_protocol_test.go \
            .github/workflows/build-pr7134-v8.0.51-image.yml \
            ops/scripts/ci/immutable-tag-guard.sh \
            ops/scripts/ci/test-immutable-tag-guard.sh | sort)
          test "$changed" = "$expected"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Targeted PR7134 regression tests
        run: |
          CGO_ENABLED=0 go test \
            ./sdk/cliproxy/auth ./internal/runtime/executor \
            -run '^(TestHTTP2Protocol.*|TestCodexHTMLForbidden.*)$' \
            -count=1 -timeout 300s
      # Full suite is UNCHANGED from upstream: no skips, no waivers, no
      # continue-on-error. Local runs showed two baseline failures
      # (internal/discovery integration; TestResponsesInterruptStopsHTTPUpstream)
      # reproduced on clean v8.0.51, but CI must run it unchanged and be
      # green before the image may publish.
      - name: Full test suite (unchanged)
        run: CGO_ENABLED=0 go test ./... -count=1
      - name: Guard unit tests
        run: bash ops/scripts/ci/test-immutable-tag-guard.sh

  image:
    name: Build and publish linux/amd64 image
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          sha7=$(git rev-parse --short=7 HEAD)
          echo "version=v8.0.51-pr7134-${sha7}" >> "$GITHUB_OUTPUT"
          echo "builddate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite an existing tag
        shell: bash
        run: |
          set -euo pipefail
          ref="${IMAGE_NAME}:${{ steps.image.outputs.version }}"
          bash ops/scripts/ci/immutable-tag-guard.sh "$ref"
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.image.outputs.builddate }}
      - name: Record published digest
        id: published
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          ref="${IMAGE_NAME}@${BUILD_DIGEST}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE_NAME}:${{ steps.image.outputs.version }}@${BUILD_DIGEST} from ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify published image runtime
        env:
          PUBLISHED_REF: ${{ steps.published.outputs.ref }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$PUBLISHED_REF"
          docker pull "$ref"
          sha7=$(git rev-parse --short=7 HEAD)
          banner="$(docker run --rm --network none --entrypoint ./CLIProxyAPI "$ref" --help 2>&1)"
          echo "$banner"
          echo "$banner" | grep -Fq "CLIProxyAPI Version: v8.0.51-pr7134-${sha7}, Commit: ${SOURCE_SHA}, BuiltAt:"
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          test "$(docker image inspect "$ref" --format '{{json .Config.Entrypoint}}')" = 'null'
          test "$(docker image inspect "$ref" --format '{{json .Config.Cmd}}')" = '["./CLIProxyAPI"]'
          mkdir -p "$RUNNER_TEMP/cpa-smoke"
          printf 'host: 127.0.0.1\nport: 8317\nremote-management:\n  allow-remote: false\n  secret-key: ci-smoke-not-a-secret\napi-keys:\n  - ci-smoke-key\nlogging:\n  level: warn\n' > "$RUNNER_TEMP/cpa-smoke/config.yaml"
          chmod 755 "$RUNNER_TEMP/cpa-smoke"; chmod 644 "$RUNNER_TEMP/cpa-smoke/config.yaml"
          docker run -d --name cpa-pr7134-smoke --network none --memory 512m --cpus 1 \
            --mount "type=bind,src=$RUNNER_TEMP/cpa-smoke/config.yaml,dst=/CLIProxyAPI/config.yaml,readonly" "$ref"
          trap 'docker logs cpa-pr7134-smoke; docker rm -f cpa-pr7134-smoke' EXIT
          pid="$(docker inspect --format '{{.State.Pid}}' cpa-pr7134-smoke)"
          for attempt in $(seq 1 60); do
            if sudo nsenter -t "$pid" -n curl --noproxy '*' -fsS -o /dev/null \
              -H 'Authorization: Bearer ci-smoke-not-a-secret' \
              http://127.0.0.1:8317/v0/management/config; then exit 0; fi
            sleep 1
          done
          exit 1
