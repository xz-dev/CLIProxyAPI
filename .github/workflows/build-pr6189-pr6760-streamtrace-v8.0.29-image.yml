name: Build CPA stream trace candidate

on:
  push:
    branches:
      - ci-pr6189-pr6760-streamtrace-v8.0.29-image
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-pr6189-pr6760-streamtrace-v8.0.29-image
  cancel-in-progress: false

env:
  # Preserve production v8.0.29 + PR 6189 + PR 6760; add stream diagnostics only.
  SOURCE_SHA: c816ab5e575b35ba0625bd9adb8deb9571939a85
  IMAGE: ghcr.io/xz-dev/cli-proxy-api
  IMAGE_TAG: v8.0.29-pr6189-pr6760-streamtrace-c816ab5

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact production candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test patched packages
        run: go test -count=1 -timeout 5m ./sdk/api/handlers/... ./internal/runtime/executor ./internal/runtime/executor/helps ./internal/logging ./sdk/cliproxy/auth

      - name: Race-check SSE boundaries
        run: go test -race -count=3 -timeout 5m -run '^TestCodex(MetadataBoundaryThroughResponsesHandler|BlankPreludeDoesNotStartStream)$' ./sdk/api/handlers/openai

      - name: Race-check stream diagnostics
        run: go test -race -count=1 -timeout 5m -run 'Test(CodexStreamTrace|LogFormatterCodexStream|ResponsesCodexStreamTrace|ExecuteStreamTraceDetachesPreviousProvider)' ./internal/logging ./internal/runtime/executor ./sdk/api/handlers/openai ./sdk/cliproxy/auth

      - name: Verify server build
        run: go build -o "$RUNNER_TEMP/cli-proxy-api" ./cmd/server

      - name: Set reproducible build date
        run: echo "BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            VERSION=${{ env.IMAGE_TAG }}
            COMMIT=${{ env.SOURCE_SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          labels: |
            org.opencontainers.image.source=https://github.com/xz-dev/CLIProxyAPI
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}

      - name: Record image digest
        run: |
          printf 'Image: `%s:%s`\nDigest: `%s`\n' "$IMAGE" "$IMAGE_TAG" '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
